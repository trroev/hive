name: evals

# Hive's self-test harness (ADR-0013), hardened per ADR-0015:
#   1. invariants  — deterministic prose-regression grep, every push/PR. Its job
#                    name is the main ruleset's required check — don't rename it.
#   2. plugin-eval — the `claude plugin eval` behavioral suite (costs tokens).
#                    Manual only: Actions → evals → Run workflow, on main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

# Supersede stale runs of the same PR; every push to main gets its own run.
concurrency:
  group: evals-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  invariants:
    name: invariant check (prose regression guard)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check lifecycle invariants
        run: bash scripts/check-invariants.sh

  plugin-eval:
    name: claude plugin eval suite
    # Manual only, and only from main: reviewed code is the only code that ever runs
    # with the API key, and nothing spends tokens unless you ask for it.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # A global CLI with no lockfile to live in; the exact version pin is the control.
      - name: Install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.327 # zizmor: ignore[adhoc-packages]
      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set — add it as a repo secret to run the eval suite."
            exit 1
          fi
          claude plugin eval . \
            --trust-plugin \
            --scaffold \
            --allow-tools Bash Write Edit \
            --ablation with-without \
            --no-publish \
            --json evals/results/ci.json \
            --max-cost-usd 15 \
            --threshold 0.8
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore
