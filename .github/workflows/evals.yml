name: evals

# Hive's self-test harness (issue #5), two layers:
#   1. invariants  — deterministic grep for load-bearing lifecycle rules. Runs on
#                    every push/PR, no secrets, and gates the branch.
#   2. plugin-eval — the `claude plugin eval` behavioral suite. Early-access gated,
#                    so it runs only when an API key is configured and never blocks
#                    the branch yet; it becomes a real gate once early access is on.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  invariants:
    name: invariant check (prose regression guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check lifecycle invariants
        run: bash scripts/check-invariants.sh

  plugin-eval:
    name: claude plugin eval suite
    runs-on: ubuntu-latest
    # Don't block on the behavioral suite while `plugin eval` is early-access gated
    # and the LLM graders are inherently noisy. Flip this off once it's a trusted gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Run eval suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Early access enablement. In CI (no server-side flag fetch) `plugin eval`
          # needs an enablement env var whose EXACT NAME Anthropic provides during
          # onboarding — set it as a repo secret/variable and export it here. The
          # name below is a placeholder; replace it with the one you were given.
          # PLUGIN_EVAL_EARLY_ACCESS: "true"
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ANTHROPIC_API_KEY not set — skipping the behavioral eval suite."
            echo "(The invariant check above is the active gate.)"
            exit 0
          fi
          claude plugin eval . \
            --scaffold \
            --allow-tools Bash Write Edit \
            --ablation with-without \
            --no-publish \
            --json evals/results/ci.json \
            --max-cost-usd 15 \
            --threshold 0.8
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore
